[package]
name = "aeropanel"
version = "0.2.0"
edition = "2021"
description = "aeroPanel — TUI panel for managing servers, with first-class Minecraft support"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
serde_json = "1"

[profile.release]
lto = true
strip = true
